[package]
name = "clumsy"
version = "0.15.1"
description = "A small, fast PDF viewer"
license = "MIT"
repository = "https://github.com/ry4nolson/clumsy"
authors = ["Ryan Olson"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "clumsy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
percent-encoding = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
libc = "0.2"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSData", "NSString", "NSGeometry"] }
objc2-app-kit = { version = "0.3", features = ["NSPrintInfo", "NSPrintOperation", "NSWindow", "NSResponder", "NSView", "NSPrintPanel", "NSGraphicsContext", "NSMenu", "NSMenuItem", "NSImage", "NSCell", "NSPasteboard", "objc2-core-graphics"] }
objc2-core-graphics = { version = "0.3", features = ["CGContext"] }
objc2-pdf-kit = { version = "0.3", features = ["PDFDocument", "PDFPage", "objc2-app-kit", "objc2-core-graphics"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView", "objc2-app-kit"] }
cms = "0.2"
x509-cert = { version = "0.2", features = ["std"] }
x509-tsp = "0.1"
x509-ocsp = "0.2"
der = { version = "0.7", features = ["oid", "alloc", "derive"] }
const-oid = { version = "0.9", features = ["db"] }
sha1 = "0.10"
sha2 = "0.10"
security-framework = { version = "3.7", features = ["macos-12"] }
security-framework-sys = "2.17"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
cmpv2 = "0.2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
