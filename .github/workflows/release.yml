name: Build and Release

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  APP_PATH: src-tauri/target/universal-apple-darwin/release/bundle/macos/Clumsy.app
  DIST_DIR: dist-release

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
          components: clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Test
        run: pnpm test

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Determine version
        run: |
          PREVIOUS_TAG="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"
          VERSION="$(./scripts/next-version.sh)"
          echo "PREVIOUS_TAG=$PREVIOUS_TAG" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          node scripts/set-version.mjs "$VERSION"
          echo "Version set to $VERSION"

      - name: Stamp changelog
        run: |
          node scripts/stamp-changelog.mjs "$VERSION" "$(date -u +%F)" > /tmp/changelog_notes.md
          if [ -s /tmp/changelog_notes.md ]; then
            echo "CHANGELOG_STAMPED=true" >> $GITHUB_ENV
            echo "Moved [Unreleased] under [$VERSION]"
          else
            echo "No unreleased changelog entries; release notes will list commits"
          fi

      - name: Import signing certificate
        env:
          CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          if [ -z "$CERTIFICATE_P12" ]; then
            echo "No signing certificate configured, skipping"
            echo "CODESIGN_IDENTITY=-" >> $GITHUB_ENV
            exit 0
          fi
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"

          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN_PATH" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"

          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

          echo "CODESIGN_IDENTITY=Developer ID Application: Texas Beard Company LLC (M3C8F32WA5)" >> $GITHUB_ENV

      - name: Build and sign app bundle
        run: |
          set -euo pipefail
          APPLE_SIGNING_IDENTITY="$CODESIGN_IDENTITY" pnpm tauri build --target universal-apple-darwin --bundles app
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          lipo -archs "$APP_PATH/Contents/MacOS/clumsy"

      - name: Package zip
        run: |
          set -euo pipefail
          mkdir -p "$DIST_DIR"
          ditto -c -k --keepParent "$APP_PATH" "$DIST_DIR/Clumsy.zip"
          echo "✓ $DIST_DIR/Clumsy.zip"

      - name: Notarize app zip
        if: env.CODESIGN_IDENTITY != '' && env.CODESIGN_IDENTITY != '-'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: M3C8F32WA5
        run: |
          echo "==> Submitting zip for notarization..."
          xcrun notarytool submit "$DIST_DIR/Clumsy.zip" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

          echo "==> Stapling notarization ticket to app..."
          xcrun stapler staple "$APP_PATH"

          echo "==> Re-creating zip with stapled ticket..."
          rm -f "$DIST_DIR/Clumsy.zip"
          ditto -c -k --keepParent "$APP_PATH" "$DIST_DIR/Clumsy.zip"

      - name: Create DMG
        run: ./scripts/create-dmg.sh "$APP_PATH" "$DIST_DIR/Clumsy.dmg"

      - name: Sign and notarize DMG
        if: env.CODESIGN_IDENTITY != '' && env.CODESIGN_IDENTITY != '-'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: M3C8F32WA5
        run: |
          codesign --force --sign "$CODESIGN_IDENTITY" "$DIST_DIR/Clumsy.dmg"

          echo "==> Submitting DMG for notarization..."
          xcrun notarytool submit "$DIST_DIR/Clumsy.dmg" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

          echo "==> Stapling notarization ticket to DMG..."
          xcrun stapler staple "$DIST_DIR/Clumsy.dmg"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Clumsy
          path: |
            ${{ env.DIST_DIR }}/Clumsy.zip
            ${{ env.DIST_DIR }}/Clumsy.dmg

      - name: Write release notes
        run: |
          if [ "${CHANGELOG_STAMPED:-}" = "true" ]; then
            NOTES="$(cat /tmp/changelog_notes.md)"
          else
            RANGE="${PREVIOUS_TAG:+$PREVIOUS_TAG..}HEAD"
            NOTES=$(git log "$RANGE" --no-merges --format='- %s')
          fi
          {
            echo "$NOTES"
            if [ -n "$PREVIOUS_TAG" ]; then
              echo
              echo "**Full changelog:** https://github.com/${{ github.repository }}/compare/$PREVIOUS_TAG...v$VERSION"
            fi
          } > /tmp/release_notes.md
          cat /tmp/release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Clumsy v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          files: |
            ${{ env.DIST_DIR }}/Clumsy.zip
            ${{ env.DIST_DIR }}/Clumsy.dmg
          body_path: /tmp/release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit release metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          if [ "${CHANGELOG_STAMPED:-}" = "true" ]; then
            git add CHANGELOG.md
          fi
          if git diff --cached --quiet; then
            echo "No version or changelog changes to commit"
            exit 0
          fi
          git commit -m "Release v$VERSION"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          echo "::error::Could not push the release metadata; set version $VERSION and stamp CHANGELOG.md by hand"
          exit 1
