name: Build and Release

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'vite.config.ts'
      - 'tsconfig*.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  DIST_DIR: dist-release

jobs:
  build:
    runs-on: macos-15
    env:
      APP_PATH: src-tauri/target/universal-apple-darwin/release/bundle/macos/Clumsy.app
    outputs:
      sha: ${{ steps.handoff.outputs.sha }}
      version: ${{ steps.handoff.outputs.version }}
      previous_tag: ${{ steps.handoff.outputs.previous_tag }}
      changelog_stamped: ${{ steps.handoff.outputs.changelog_stamped }}
      signed: ${{ steps.handoff.outputs.signed }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
          components: clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Test
        run: pnpm test

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Determine version
        run: |
          PREVIOUS_TAG="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"
          VERSION="$(node scripts/next-version.mjs)"
          echo "PREVIOUS_TAG=$PREVIOUS_TAG" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          node scripts/set-version.mjs "$VERSION"
          echo "Version set to $VERSION"

      - name: Stamp changelog
        run: |
          node scripts/stamp-changelog.mjs "$VERSION" "$(date -u +%F)" > /tmp/changelog_notes.md
          if [ -s /tmp/changelog_notes.md ]; then
            echo "CHANGELOG_STAMPED=true" >> $GITHUB_ENV
            echo "Moved [Unreleased] under [$VERSION]"
          else
            echo "No unreleased changelog entries; release notes will list commits"
          fi

      - name: Import signing certificate
        env:
          CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          if [ -z "$CERTIFICATE_P12" ]; then
            echo "No signing certificate configured, skipping"
            echo "CODESIGN_IDENTITY=-" >> $GITHUB_ENV
            exit 0
          fi
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"

          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN_PATH" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"

          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

          echo "CODESIGN_IDENTITY=Developer ID Application: Texas Beard Company LLC (M3C8F32WA5)" >> $GITHUB_ENV

      - name: Build and sign app bundle
        run: |
          set -euo pipefail
          APPLE_SIGNING_IDENTITY="$CODESIGN_IDENTITY" pnpm tauri build --target universal-apple-darwin --bundles app
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          lipo -archs "$APP_PATH/Contents/MacOS/clumsy"

      - name: Stage the build for publishing
        id: handoff
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/release-build"
          mkdir -p "$STAGE/metadata/src-tauri"
          ditto -c -k --keepParent "$APP_PATH" "$STAGE/Clumsy.zip"
          cp /tmp/changelog_notes.md "$STAGE/changelog_notes.md"
          cp package.json CHANGELOG.md "$STAGE/metadata/"
          cp src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock "$STAGE/metadata/src-tauri/"
          {
            echo "sha=$(git rev-parse HEAD)"
            echo "version=$VERSION"
            echo "previous_tag=$PREVIOUS_TAG"
            echo "changelog_stamped=${CHANGELOG_STAMPED:-}"
            echo "signed=$([ "$CODESIGN_IDENTITY" != "-" ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

      - name: Upload the staged build
        uses: actions/upload-artifact@v4
        with:
          name: release-build
          path: ${{ runner.temp }}/release-build
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: build
    runs-on: macos-15
    env:
      VERSION: ${{ needs.build.outputs.version }}
      PREVIOUS_TAG: ${{ needs.build.outputs.previous_tag }}
      CHANGELOG_STAMPED: ${{ needs.build.outputs.changelog_stamped }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.sha }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download the staged build
        uses: actions/download-artifact@v4
        with:
          name: release-build
          path: ${{ runner.temp }}/release-build

      - name: Import signing certificate
        env:
          CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          if [ "${{ needs.build.outputs.signed }}" != "true" ] || [ -z "$CERTIFICATE_P12" ]; then
            echo "No signing certificate configured, skipping"
            echo "CODESIGN_IDENTITY=-" >> $GITHUB_ENV
            exit 0
          fi
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"

          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN_PATH" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"

          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

          echo "CODESIGN_IDENTITY=Developer ID Application: Texas Beard Company LLC (M3C8F32WA5)" >> $GITHUB_ENV

      - name: Unpack the staged build
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/release-build"
          cp -R "$STAGE/metadata/." .
          cp "$STAGE/changelog_notes.md" /tmp/changelog_notes.md
          mkdir -p "$DIST_DIR" "$RUNNER_TEMP/app"
          cp "$STAGE/Clumsy.zip" "$DIST_DIR/Clumsy.zip"
          ditto -x -k "$STAGE/Clumsy.zip" "$RUNNER_TEMP/app"
          APP_PATH="$RUNNER_TEMP/app/Clumsy.app"
          if [ "$CODESIGN_IDENTITY" != "-" ]; then
            codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          fi
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Notarize app zip
        if: env.CODESIGN_IDENTITY != '' && env.CODESIGN_IDENTITY != '-'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: M3C8F32WA5
        run: |
          echo "==> Submitting zip for notarization..."
          xcrun notarytool submit "$DIST_DIR/Clumsy.zip" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

          echo "==> Stapling notarization ticket to app..."
          for attempt in 1 2 3; do
            if xcrun stapler staple "$APP_PATH"; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              exit 1
            fi
            echo "Stapling failed, retrying in 20 seconds..."
            sleep 20
          done

          echo "==> Re-creating zip with stapled ticket..."
          rm -f "$DIST_DIR/Clumsy.zip"
          ditto -c -k --keepParent "$APP_PATH" "$DIST_DIR/Clumsy.zip"

      - name: Create signed update archive
        if: env.CODESIGN_IDENTITY != '' && env.CODESIGN_IDENTITY != '-'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::warning::No updater signing key configured; this release ships without latest.json, so installed copies can't update to it in place"
            exit 0
          fi
          COPYFILE_DISABLE=1 tar -czf "$DIST_DIR/Clumsy.app.tar.gz" -C "$(dirname "$APP_PATH")" "$(basename "$APP_PATH")"
          pnpm tauri signer sign --app-version "$VERSION" "$DIST_DIR/Clumsy.app.tar.gz"
          echo "UPDATER_SIGNED=true" >> $GITHUB_ENV

      - name: Create DMG
        run: |
          brew install create-dmg
          ./scripts/create-dmg.sh "$APP_PATH" "$DIST_DIR/Clumsy.dmg"

      - name: Sign and notarize DMG
        if: env.CODESIGN_IDENTITY != '' && env.CODESIGN_IDENTITY != '-'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: M3C8F32WA5
        run: |
          codesign --force --sign "$CODESIGN_IDENTITY" "$DIST_DIR/Clumsy.dmg"

          echo "==> Submitting DMG for notarization..."
          xcrun notarytool submit "$DIST_DIR/Clumsy.dmg" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

          echo "==> Stapling notarization ticket to DMG..."
          for attempt in 1 2 3; do
            if xcrun stapler staple "$DIST_DIR/Clumsy.dmg"; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              exit 1
            fi
            echo "Stapling failed, retrying in 20 seconds..."
            sleep 20
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Clumsy
          path: |
            ${{ env.DIST_DIR }}/Clumsy.zip
            ${{ env.DIST_DIR }}/Clumsy.dmg
            ${{ env.DIST_DIR }}/Clumsy.app.tar.gz

      - name: Write release notes
        run: |
          if [ "${CHANGELOG_STAMPED:-}" = "true" ]; then
            NOTES="$(cat /tmp/changelog_notes.md)"
          else
            RANGE="${PREVIOUS_TAG:+$PREVIOUS_TAG..}HEAD"
            NOTES=$(git log "$RANGE" --no-merges --format='- %s')
          fi
          {
            echo "$NOTES"
            if [ -n "$PREVIOUS_TAG" ]; then
              echo
              echo "**Full changelog:** https://github.com/${{ github.repository }}/compare/$PREVIOUS_TAG...v$VERSION"
            fi
          } > /tmp/release_notes.md
          cat /tmp/release_notes.md

      - name: Write update manifest
        if: env.UPDATER_SIGNED == 'true'
        run: |
          node scripts/update-manifest.mjs "$VERSION" "$DIST_DIR/Clumsy.app.tar.gz.sig" /tmp/release_notes.md "https://github.com/${{ github.repository }}" > "$DIST_DIR/latest.json"
          cat "$DIST_DIR/latest.json"

      - name: Commit release metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          if [ "${CHANGELOG_STAMPED:-}" = "true" ]; then
            git add CHANGELOG.md
          fi
          if git diff --cached --quiet; then
            echo "No version or changelog changes to commit"
          else
            git commit -m "Release v$VERSION"
            pushed=false
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                pushed=true
                break
              fi
              git rebase --abort 2>/dev/null || true
              sleep 5
            done
            if [ "$pushed" != "true" ]; then
              echo "::error::Could not push the release metadata, so nothing was published. Run the workflow again."
              exit 1
            fi
          fi
          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Clumsy v${{ env.VERSION }}
          target_commitish: ${{ env.RELEASE_SHA }}
          files: |
            ${{ env.DIST_DIR }}/Clumsy.zip
            ${{ env.DIST_DIR }}/Clumsy.dmg
            ${{ env.DIST_DIR }}/Clumsy.app.tar.gz
            ${{ env.DIST_DIR }}/latest.json
          body_path: /tmp/release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
