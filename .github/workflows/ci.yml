name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Test
        run: pnpm test

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Build app bundle
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: pnpm tauri build --bundles app

      - name: Verify app bundle
        run: |
          set -euo pipefail
          APP="src-tauri/target/release/bundle/macos/Clumsy.app"
          test -x "$APP/Contents/MacOS/clumsy"
          test -f "$APP/Contents/Info.plist"
          test -f "$APP/Contents/Resources/icon.icns"
          codesign --verify --verbose=2 "$APP"
          plutil -p "$APP/Contents/Info.plist" | head -20
          echo "✓ Clumsy.app looks good"
