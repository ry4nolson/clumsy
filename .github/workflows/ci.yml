name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - 'tests/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Test
        run: pnpm test

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Build app bundle
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: pnpm tauri build --bundles app

      - name: Verify app bundle
        run: |
          set -euo pipefail
          APP="src-tauri/target/release/bundle/macos/Clumsy.app"
          test -x "$APP/Contents/MacOS/clumsy"
          test -f "$APP/Contents/Info.plist"
          test -f "$APP/Contents/Resources/icon.icns"
          codesign --verify --verbose=2 "$APP"
          plutil -p "$APP/Contents/Info.plist" | head -20
          echo "✓ Clumsy.app looks good"

  windows:
    runs-on: windows-latest
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build installer
        run: pnpm tauri build --bundles nsis

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Clumsy-windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

  android:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Point the build at the Android NDK
        run: echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - name: Configure signing
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/clumsy.jks"
          keytool -genkeypair -keystore "$KEYSTORE" -storepass throwaway -keypass throwaway -alias clumsy -keyalg RSA -keysize 2048 -validity 30 -dname "CN=Clumsy CI"
          printf 'storeFile=%s\npassword=throwaway\nkeyAlias=clumsy\n' "$KEYSTORE" > src-tauri/gen/android/keystore.properties

      - name: Build APK
        run: pnpm tauri android build --target aarch64 --apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Clumsy-Android
          path: src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk
          retention-days: 7
          if-no-files-found: error

  linux:
    runs-on: ubuntu-22.04
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev rpm xvfb imagemagick

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm tauri build --bundles deb,rpm,appimage

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: Clumsy-linux-x64
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 14

      - name: Launch the app
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: 1
        run: |
          set -euo pipefail
          xvfb-run -a -s "-screen 0 1400x900x24" dbus-run-session -- bash -c '
            src-tauri/target/release/clumsy &
            pid=$!
            sleep 20
            kill -0 $pid
            import -window root clumsy-linux.png
            kill $pid
          '

      - name: Upload the launch screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Clumsy-linux-screenshot
          path: clumsy-linux.png
          if-no-files-found: warn
          retention-days: 14

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

  ios:
    runs-on: macos-26
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build for the simulator
        run: pnpm tauri ios build --debug --target aarch64-sim
